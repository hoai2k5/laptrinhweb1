<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
    <style>* {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    
    body {
        background-color: #f8f8f8;
        text-align: center;
    }
    
    .container {
        width: 100%;
        max-width: 600px;
        margin: 50px auto;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
    
    /* Menu */
    .menu {
        padding: 10px;
        font-size: 16px;
    }
    
    .menu a {
        text-decoration: none;
        color: black;
        font-weight: bold;
    }
    
    .menu .active {
        color: blue;
    }
    
    /* Form đăng nhập */
    .login-box {
        border: 2px solid #ddd;
        padding: 20px;
        text-align: left;
    }
    
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    
    form label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
    }
    
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    
    /* Checkbox */
    .remember-me {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 10px;
    }
    
    /* Nút đăng nhập */
    button {
        width: 100%;
        padding: 10px;
        background-color: blue;
        color: white;
        border: none;
        font-size: 16px;
        cursor: pointer;
        border-radius: 4px;
    }
    
    button:hover {
        background-color: darkblue;
    }
    
    /* Quên mật khẩu */
    .forgot {
        display: block;
        margin-bottom: 10px;
        color: blue;
        text-decoration: none;
        text-align: center;
    }
    
    /* Footer */
    footer {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
    }
    </style>
</head>
<body>

    <div class="container">
        <nav class="menu">
            <a href="#">Home</a> | 
            <a href="#" class="active">Đăng nhập</a> | 
            <a href="#">Đăng ký</a>
        </nav>

        <div class="login-box">
            <h2>Màn hình đăng nhập</h2>
            <form>
                <label>Username</label>
                <input type="text" placeholder="Nhập username">
                
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu">

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ghi nhớ đăng nhập</label>
                </div>

                <a href="#" class="forgot">Quên mật khẩu</a>
                <button type="submit">Đăng nhập</button>
            </form>
        </div>

        <footer>
            <p>Lập trình web @01/2024</p>
        </footer>
    </div>

</body>
</html>
